[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "soulstruct-havok"
description = "Havok tools extension for `soulstruct`."
readme = "README.md"
version = "1.3.0"
license = "GPL-3.0-or-later"
requires-python = ">=3.13"  # Blender >=5.1
keywords = ["modding", "Havok", "FromSoftware", "Dark Souls", "Bloodborne", "Elden Ring", "Sekiro", "Demon's Souls"]
classifiers = [
    "Programming Language :: Python :: 3",
]
authors = [
    { name = "Scott Mooney (Grimrukh)", email = "grimrukh@gmail.com" }
]

dependencies = [
    "soulstruct>=2.4.5",
    "constrata>=1.3.3",     # required for binary read/write (my package)
    "numpy",                # required for math classes/operations
    "rich>=13",             # required for nice printing/logging
    "scipy>=1.18.0",        # required for additional math classes/operations (e.g. quaternions)
    "typer",                # required for CLI
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
soulstruct-havok = [
    "**/*.json",
    "**/*.txt",
    "**/*.xml",
    "**/*.dcx",
    "**/*.dll",
    "**/*.exe",
    "**/*.pdb",
    "**/*.hkx",  # template Havok files
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
# `importmode=importlib` + `consider_namespace_packages` keep collection working with the
# `soulstruct` namespace package and allow same-named test modules in different game folders.
addopts = "-ra --import-mode=importlib"
consider_namespace_packages = true
markers = [
    "game_data: test requires an unpacked vanilla game directory",
    "slow: test reads a whole game directory and is slow",
]
filterwarnings = ["default"]

[project.urls]
homepage    = "https://github.com/Grimrukh/soulstruct-havok"
repository  = "https://github.com/Grimrukh/soulstruct-havok"
"Issues"    = "https://github.com/Grimrukh/soulstruct-havok/issues"
